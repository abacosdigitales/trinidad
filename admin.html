<style>
:root{--card:#07090f;--card2:#0b1020;--line:#14223f;--mut:#8b97b3;--b1:#0b5cff;--b2:#19b4ff;--grad:linear-gradient(90deg,#0b5cff,#19b4ff);--ok:#2ecc71;--warn:#f5a623;--bad:#ff5d5d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.o,h1,h2,h3{font-family:Orbitron,"Segoe UI",sans-serif;letter-spacing:.04em}
.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.w{max-width:1180px;margin:auto;padding:0 16px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:#03060d;position:sticky;top:0;z-index:20}
header img{height:48px}header h1{font-size:1.05rem;margin:0}header .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:9px;padding:9px 15px;font:inherit;font-size:.84rem;font-weight:700;cursor:pointer;color:#fff;background:var(--card2);border:1px solid var(--line);transition:.15s}
.btn:hover{border-color:var(--b2)}.btn.pri{background:var(--grad);border-color:transparent}.btn.wa{background:#1fa855;border-color:transparent}.btn.bad{color:var(--bad)}.btn.sm{padding:5px 10px;font-size:.76rem}
.tabs{display:flex;gap:6px;padding:14px 0 6px}.tabs .btn.on{background:var(--grad);border-color:transparent}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.kpi small{color:var(--mut);font-size:.72rem}.kpi b{display:block;font-family:Orbitron,sans-serif;font-size:1.1rem;margin-top:2px}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
input,select,textarea{background:var(--card2);border:1px solid var(--line);color:#fff;border-radius:9px;padding:9px 11px;font:inherit;font-size:.86rem;max-width:100%}
.tb input{flex:1 1 200px}textarea{width:100%;min-height:90px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.84rem}th{color:var(--b2);text-align:left;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:10px}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}td small{display:block;color:var(--mut)}.r{text-align:right;white-space:nowrap}
.empty{padding:34px;text-align:center;color:var(--mut)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:10px 0}
.banner{background:#2a1d08;color:var(--warn);border-radius:10px;padding:9px 12px;font-size:.82rem;margin:10px 0}
.ed{display:grid;grid-template-columns:1fr 340px;gap:16px;margin:12px 0 60px}@media(max-width:900px){.ed{grid-template-columns:1fr}}
.ed h2{font-size:1rem;margin:0}.f{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center;margin:8px 0;font-size:.84rem}.f label{color:var(--mut)}
@media(max-width:560px){.f{grid-template-columns:1fr}}.f select,.f input{width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chip{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:.76rem;cursor:pointer;color:#cfe0ff}.chip:hover{border-color:var(--b2)}
.sum{position:sticky;top:76px;align-self:start}@media(max-width:900px){.sum{position:static}}
.row{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;padding:5px 0;border-bottom:1px dashed var(--line)}.row span:first-child{color:var(--mut)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0}.tot b{font-family:Orbitron,sans-serif;font-size:1.35rem}
.chk div{font-size:.78rem;color:var(--mut);padding:2px 0}.chk .y{color:var(--ok)}
.msg{font-size:.78rem;border-radius:8px;padding:8px 10px;margin-top:8px;background:#071a33;color:#9fc4ff}.msg.w{background:#2a1d08;color:var(--warn)}.msg.ok{background:#07200f;color:var(--ok)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.acts .btn{width:100%}
.ex{display:grid;grid-template-columns:1fr 120px 34px;gap:6px;margin:5px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:#0b1633;border:1px solid var(--b2);padding:10px 16px;border-radius:10px;font-size:.82rem;opacity:0;transition:.3s;pointer-events:none;z-index:50}#toast.on{opacity:1;transform:translateX(-50%)}
.st{display:inline-block;border-radius:20px;padding:2px 10px;font-size:.7rem;border:1px solid var(--line)}
td input{width:130px}.tw td input{padding:5px 8px}#lerr{color:var(--bad);font-size:.82rem;margin-top:8px}
.login{max-width:380px;margin:60px auto}.login input{width:100%;margin:6px 0}.pre{white-space:pre-wrap;font-size:.74rem;color:var(--mut);max-height:220px;overflow:auto;background:var(--card2);border-radius:8px;padding:10px}
#printarea{display:none}
@media print{body>*:not(#printarea){display:none!important}#printarea{display:block;color:#000;background:#fff;padding:0;font-family:system-ui,sans-serif}
#printarea .qh{background:#000;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:10px}#printarea .qh img{height:62px}
#printarea table{margin:14px 0}#printarea th{color:#0b5cff;border-bottom:2px solid #0b5cff}#printarea td{border-top:1px solid #ddd}#printarea td small{color:#555}
#printarea .qt{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:700;border-top:2px solid #0b5cff;padding-top:8px}#printarea .fine{color:#555;font-size:.74rem;margin-top:12px}}
</style>

/* ---------- almacenamiento ---------- */
function load(){try{ORD=JSON.parse(localStorage.getItem("tc_pedidos")||"[]")}catch(e){ORD=[]}}
function save(){try{localStorage.setItem("tc_pedidos",JSON.stringify(ORD))}catch(e){toast("No se pudo guardar en este navegador")}}
/* ---------- catálogo y compatibilidad ---------- */
const price=(k,o)=>CFG.precios[k+":"+o.id]!=null?CFG.precios[k+":"+o.id]:o.p;
const get=(k,s)=>D[k].find(o=>o.id===s[k])||null;
function need(s){const c=get("cpu",s),g=get("gpu",s);return Math.ceil(((c?c.w:88)+(g?g.w:0)+100)*1.3/50)*50}
function reason(k,o,s){const c=get("cpu",s),m=get("mb",s),cs=get("cs",s),g=get("gpu",s);
 if(k==="mb"&&c&&o.s!==c.s)return "zócalo "+o.s+" ≠ "+c.n;
 if(k==="cpu"&&m&&o.s!==m.s)return "no va con la placa "+m.n;
 if(k==="ram"&&m&&o.m!==m.m)return "la placa usa "+m.m;
 if(k==="mb"&&cs&&cs.f.indexOf(o.f)<0)return "no entra en el gabinete";
 if(k==="cs"&&m&&o.f.indexOf(m.f)<0)return "no soporta placa "+m.f;
 if(k==="cs"&&g&&g.l>o.l)return "no entra la placa de video";
 if(k==="gpu"&&cs&&o.l>cs.l)return "no entra en el gabinete";
 if(k==="ps"&&o.x<need(s))return "insuficiente (~"+need(s)+"W)";return null}
function prune(s){let ch=1;const R=[];while(ch){ch=0;CATS.forEach(([k])=>{const o=get(k,s);if(o&&reason(k,o,s)){R.push(o.n);delete s[k];ch=1}})}return R}
function pruneKeep(s,keep){let ch=1;const R=[];while(ch){ch=0;CATS.forEach(([k])=>{if(k===keep)return;const o=get(k,s);if(o&&reason(k,o,s)){R.push(o.n);delete s[k];ch=1}})}return R}
function notes(s){const c=get("cpu",s),m=get("mb",s),g=get("gpu",s),a=[];
 if(c&&g&&g.id==="none"&&!c.ig)a.push(["w","Este procesador no tiene video integrado: falta una placa de video."]);
 if(c&&m&&c.w>=142&&m.v<2)a.push(["w","La placa "+m.n+" es básica para el "+c.n+"."]);
 if(c&&m&&c.w>=230&&m.v<3)a.push(["w","El "+c.n+" pide una placa de gama alta."]);
 if(c&&m&&m.bios&&(c.fam==="8000"||c.fam==="9000"))a.push(["","Con "+m.n+" y "+c.n+" puede hacer falta actualizar la BIOS."]);
 if(c&&c.sc)a.push(["","El procesador no incluye cooler: se suma uno básico."]);return a}
function calc(o){const items=[];let sub=0;CATS.forEach(([k,l])=>{const x=get(k,o.s);if(x){const p=price(k,x);sub+=p;items.push({k,l,x,p})}});
 const c=get("cpu",o.s),cooler=c&&c.sc?CFG.cooler:0,has=items.length>0;
 const armado=has?(o.armado!==""&&o.armado!=null?+o.armado:CFG.armado):0,ex=(o.extras||[]).reduce((a,e)=>a+(+e.p||0),0);
 const envio=o.entrega==="envio"?(o.envio!==""&&o.envio!=null?+o.envio:CFG.envio):0,dto=+o.dto||0;
 const total=Math.max(0,sub+cooler+armado+ex+envio-dto);let gan=null;
 if(COSTOS&&has){let cs=0,ok=true;items.forEach(i=>{const v=COSTOS[i.k+":"+i.x.id];if(v==null)ok=false;else cs+=v});if(c&&c.sc)cs+=COOLER_COSTO;if(ok)gan=total-envio-cs}
 return {items,sub,cooler,armado,ex,envio,dto,total,gan}}
const resumen=o=>{const c=get("cpu",o.s),g=get("gpu",o.s);return (c?c.n:"—")+(g&&g.id!=="none"?" + "+g.n:"")};
const qnum=()=>{const d=new Date();return "TC-"+String(d.getFullYear()).slice(2)+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2)+"-"+Math.floor(100+Math.random()*900)};
const newOrder=(p)=>Object.assign({id:Date.now().toString(36)+Math.floor(Math.random()*99),qn:qnum(),fecha:Date.now(),estado:"Nuevo",nombre:"",tel:"",notas:"",s:{},extras:[],dto:"",armado:"",entrega:"retiro",envio:""},p||{});
/* ---------- importar pedido desde el mensaje de WhatsApp ---------- */
function decodeCode(t){const m=String(t).match(/TC1\.([A-Za-z0-9_-]+)/);if(!m)return null;try{let b=m[1].replace(/-/g,"+").replace(/_/g,"/");b+="=".repeat((4-b.length%4)%4);return JSON.parse(decodeURIComponent(escape(atob(b))))}catch(e){return null}}
function importCode(t){const j=decodeCode(t);if(!j||!j.s){toast("No encontré un código de pedido en ese texto");return false}
 const o=newOrder({qn:j.q||qnum(),nombre:j.n||"",s:j.s,entrega:j.e==="envio"?"envio":"retiro"});prune(o.s);persist(o);toast("Pedido "+o.qn+" importado");return o}

function waText(o){const t=calc(o),L=["Hola"+(o.nombre?" "+o.nombre:"")+"! Te paso tu presupuesto de *Trinidad Computers* (N° "+o.qn+"):"];
 t.items.forEach(i=>L.push("• "+i.l+": "+i.x.n+" ("+fmt(i.p)+")"));if(t.cooler)L.push("• Cooler para procesador: "+fmt(t.cooler));
 L.push("• Armado y testeo: "+fmt(t.armado));(o.extras||[]).forEach(e=>{if(e.c||+e.p)L.push("• "+(e.c||"Adicional")+": "+fmt(+e.p||0))});
 if(t.envio)L.push("• Envío a domicilio: "+fmt(t.envio));if(t.dto)L.push("• Descuento: -"+fmt(t.dto));
 L.push("*TOTAL: "+fmt(t.total)+"*","Validez: 48 hs. ¿Lo confirmamos?");return L.join("\n")}
function waNum(t){let d=String(t||"").replace(/\D/g,"");if(!d)return"";if(d.startsWith("54"))return d.startsWith("549")?d:"549"+d.slice(2);if(d.startsWith("0"))d=d.slice(1);return "549"+d}
function printQuote(o){const t=calc(o),v=new Date(Date.now()+172800000);
 let h='<div class="qh"><img src="'+LOGO+'" alt=""><div style="text-align:right;font-size:.82rem">Presupuesto<br><b style="font-family:Orbitron,sans-serif">'+esc(o.qn)+'</b><br>'+f2(o.fecha)+' · válido hasta '+f2(v)+'</div></div>';

document.addEventListener("fbready",ev=>{if(ev.detail.ok)arrancarFB()});if(window.FB)arrancarFB();
load();
fetch("precios.json?d="+new Date().toISOString().slice(0,10),{cache:"no-cache"}).then(r=>r.ok?r.json():{}).catch(()=>({})).then(j=>{for(const k in j)CFG[k]=j[k];render()});
if(location.hash.indexOf("#p=")===0){const o=importCode(location.hash.slice(3));history.replaceState(null,"",location.pathname);if(o)V.edit=o.id}
render();
