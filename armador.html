<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Armá tu PC · Trinidad Computers</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#07090f;--card2:#0b1020;--line:#14223f;--txt:#fff;--mut:#8b97b3;--b1:#0b5cff;--b2:#19b4ff;--grad:linear-gradient(90deg,#0b5cff,#19b4ff);--ok:#2ecc71;--warn:#f5a623;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 50% -150px,#0a1a40 0,#000 70%) no-repeat,#000;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:1120px;margin:auto;padding:0 16px}
header{display:flex;align-items:center;gap:16px;padding:18px 0 6px}
header img{height:84px;width:auto;display:block}
header h1{margin:0;font-size:1.35rem;font-family:Orbitron,"Segoe UI",sans-serif;letter-spacing:.04em}
header p{margin:4px 0 0;color:var(--mut);font-size:.86rem}
#fx{display:inline-block;margin-top:6px;font-size:.72rem;color:var(--b2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;background:#060b18}
.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stepper{display:flex;gap:6px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.st{flex:1 0 auto;min-width:104px;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:8px 10px;font:inherit;font-size:.74rem;text-align:left;cursor:pointer;transition:.2s}
.st b{display:block;font-family:Orbitron,sans-serif;font-size:.7rem;margin-bottom:2px}
.st.done{color:#cfe0ff;border-color:#1b3d86}.st.done b{color:var(--b2)}
.st.cur{color:#fff;border-color:var(--b2);box-shadow:0 0 14px rgba(25,180,255,.35)}
.st:disabled{opacity:.35;cursor:not-allowed}
.bar{height:3px;background:var(--line);border-radius:3px;margin-bottom:18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);transition:width .4s}
main{display:grid;grid-template-columns:1fr 330px;gap:20px;padding-bottom:60px}
main.full{grid-template-columns:1fr}
@media(max-width:860px){main{grid-template-columns:1fr;padding-bottom:90px}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel h2{margin:0;font-size:1.25rem;font-family:Orbitron,sans-serif;letter-spacing:.04em}
.kick{color:var(--b2);font-size:.72rem;font-family:Orbitron,sans-serif}
.panel .lead{color:var(--mut);font-size:.9rem;margin:6px 0 14px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:12px;border:1px dashed #1b3d86;border-radius:12px;background:#050b1a}
.presets span{width:100%;font-size:.76rem;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:6px 12px;font:inherit;font-size:.78rem;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--b1);color:#fff}.chip.on{background:var(--grad);border-color:transparent;color:#fff}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.in,select{background:var(--card2);border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px 12px;font:inherit;font-size:.85rem}
.fbar .in{flex:1 1 180px}.fbar label{font-size:.78rem;color:var(--mut);display:flex;gap:6px;align-items:center;cursor:pointer}
#cnt{font-size:.74rem;color:var(--mut);margin:0 0 8px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:10px}
.opt{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;color:var(--txt);cursor:pointer;font:inherit;transition:.18s;animation:rise .35s both}
.opt:hover:not(:disabled){border-color:var(--b1);transform:translateY(-2px);box-shadow:0 6px 20px rgba(11,92,255,.2)}
.opt.sel{border-color:var(--b2);box-shadow:0 0 0 1px var(--b2) inset,0 0 18px rgba(11,92,255,.4)}
.opt:disabled{opacity:.36;cursor:not-allowed}
.opt .n{font-weight:700;font-size:.95rem}.opt .d{color:var(--mut);font-size:.77rem;margin-top:3px}
.tg{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.tg i{font-style:normal;font-size:.64rem;border:1px solid #1b3d86;color:#9fc4ff;border-radius:6px;padding:1px 6px}
.tg i.hl{background:var(--grad);border-color:transparent;color:#fff}
.opt .p{margin-top:10px;font-family:Orbitron,sans-serif;font-size:.95rem;color:var(--b2)}
.opt .why{color:var(--warn);font-size:.73rem;margin-top:6px}
.empty{color:var(--mut);padding:24px;text-align:center;font-size:.88rem;grid-column:1/-1}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.btn{border:0;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer;color:#fff;transition:.15s}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn.pri{background:var(--grad)}.btn.sec{background:transparent;border:1px solid var(--line);color:var(--mut)}.btn.wa{background:#1fa855}
.btn:disabled{opacity:.35;cursor:not-allowed}
aside{position:sticky;top:12px;align-self:start}
@media(max-width:860px){aside{position:static}}
aside h3{margin:0 0 10px;font-size:.95rem;font-family:Orbitron,sans-serif}
.row{display:flex;justify-content:space-between;gap:10px;font-size:.83rem;padding:6px 0;border-bottom:1px dashed var(--line)}
.row span:first-child{color:var(--mut)}.row span:last-child{text-align:right}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 4px}
.tot span:last-child{font-family:Orbitron,sans-serif;font-size:1.3rem}
.chk{margin-top:14px;font-size:.78rem}.chk div{padding:3px 0;color:var(--mut)}.chk .y{color:var(--ok)}
.msg{font-size:.8rem;border-radius:8px;padding:9px 10px;margin-top:10px;background:#2a1d08;color:var(--warn)}
.msg.ok{background:#07200f;color:var(--ok)}.msg.in2{background:#071a33;color:#9fc4ff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:#0b1633;border:1px solid var(--b2);color:#fff;padding:10px 16px;border-radius:10px;font-size:.82rem;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#mini{display:none;position:fixed;left:0;right:0;bottom:0;background:#050912ee;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));justify-content:space-between;align-items:center;z-index:5;backdrop-filter:blur(8px)}
#mini b{font-family:Orbitron,sans-serif}
@media(max-width:860px){#mini.on{display:flex}}
#quote .qh{background:#000;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-radius:12px;border:1px solid var(--line)}
#quote .qh img{height:70px}
#quote .qm{text-align:right;font-size:.82rem;color:var(--mut)}#quote .qm b{display:block;color:#fff;font-family:Orbitron,sans-serif}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:.88rem}
th{color:var(--b2);text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line);padding:8px 6px}
td{padding:9px 6px;border-bottom:1px solid var(--line)}td:last-child,th:last-child{text-align:right}
td small{display:block;color:var(--mut)}
.qt{display:flex;justify-content:space-between;align-items:baseline;font-size:1.1rem}.qt b{font-family:Orbitron,sans-serif;font-size:1.5rem}
.fine{color:var(--mut);font-size:.74rem;margin-top:12px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.acts .btn{flex:1 1 180px}
.nm{width:100%;margin-top:14px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:8px 18px;background:rgba(0,0,0,.78);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);font-size:.84rem}
.top a{color:var(--mut)}.top a:hover{color:#fff}.top .sp{margin-left:auto}.top .wl{color:#fff;background:#1fa855;border-radius:20px;padding:6px 14px;font-weight:700}
@media(max-width:560px){.top .hd{display:none}}
.opt{padding:0;overflow:hidden;display:flex;flex-direction:column}
.im{position:relative;aspect-ratio:16/10;background:radial-gradient(130px 80px at 50% 45%,#16305f,#0a1124 78%);border-bottom:1px solid var(--line);overflow:hidden}
.im svg{width:100%;height:100%;display:block}
.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px;background:#f2f5fb}
.im.ph svg{display:none}
.ob{padding:12px 14px 14px;display:flex;flex-direction:column;flex:1}
.bdg{position:absolute;top:8px;left:8px;font-size:.62rem;font-weight:700;background:var(--grad);padding:2px 9px;border-radius:20px;z-index:2}
.ck{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);border:2px solid #2a3a63;z-index:2;display:grid;place-items:center;font-size:.78rem;color:transparent;transition:.2s}
.opt.sel .ck{background:var(--grad);border-color:#fff;color:#fff;transform:scale(1.1)}
.opt .pick{margin-top:auto;padding-top:10px;font-size:.74rem;color:var(--mut);font-weight:700}
.opt.sel .pick{color:var(--b2)}.opt:hover:not(:disabled):not(.sel) .pick{color:var(--b2)}
.tip{display:flex;gap:10px;align-items:flex-start;background:#071a33;border:1px solid #123a7a;color:#bcd4ff;border-radius:10px;padding:10px 12px;font-size:.84rem;margin-bottom:14px}
.rt{display:flex;align-items:center}
.th{width:46px;height:30px;border-radius:6px;overflow:hidden;display:inline-block;margin-right:8px;flex:none;border:1px solid var(--line)}
.th .im{aspect-ratio:auto;width:46px;height:30px;border:0}.th .im img{padding:2px}
td .th{vertical-align:middle}
aside{top:64px}
main{padding-bottom:130px}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(5,9,18,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
#bar.off{display:none}
#bar .bi{max-width:1120px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
#bar .bl{display:flex;flex-direction:column;min-width:0}#bar .kick{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .bt{font-family:Orbitron,sans-serif;font-size:1.05rem}
#bar .bb{display:flex;gap:8px}#bar .btn{padding:11px 20px}
.btn.go{animation:gp 1.8s ease-in-out infinite}@keyframes gp{50%{box-shadow:0 0 0 6px rgba(25,180,255,.25)}}
.chk2{display:flex;gap:8px;align-items:flex-start;font-size:.78rem;color:var(--mut);margin:10px 0;cursor:pointer}.chk2 input{width:auto;margin:3px 0 0}
.ok2{background:#07200f;border:1px solid #1d6b3a;color:#bff0cf;border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:.92rem}
#cerr{color:var(--warn);font-size:.82rem;margin-top:8px}.small2{font-size:.76rem;color:var(--mut);margin-top:10px}.small2 a{color:var(--b2)}
@media print{body{background:#fff!important;color:#000}.noprint,#toast,#mini{display:none!important}main{display:block}.panel{border:0;background:#fff;padding:0}
th,.qt b{color:#0b5cff}td,th{border-color:#ccc}td small,.fine,#quote .qm{color:#555}.qt{color:#000}#quote .qm b{color:#fff}}
</style>
</head>
